name: Full Mark APK

on:
  push:
    branches: [main, claude/ui-ux-pro-max-skill-n9hipq]
    paths:
      - 'fullmark/**'
      - 'fullmark-apk/**'
      - '.github/workflows/fullmark-apk.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  online-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real two-device online test (PeerJS)
        run: |
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd "$GITHUB_WORKSPACE" && python3 -m http.server 8321 >/dev/null 2>&1 &)
          sleep 2
          cp "$GITHUB_WORKSPACE/.github/scripts/fullmark-online-test.js" . && node fullmark-online-test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullmark-apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null || echo "Gradle will fetch missing SDK parts"

      - name: Copy web app into Capacitor and sync
        working-directory: fullmark-apk
        run: |
          npm ci
          npm run sync

      - name: Build APK
        working-directory: fullmark-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FullMark.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FullMark-apk
          path: FullMark.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fullmark-latest
          name: فول مارك — أحدث نسخة APK
          body: |
            تطبيق «فول مارك» لأندرويد — افتح هذه الصفحة من الجوال وحمّل FullMark.apk ثم ثبّته
            (قد يطلب الجوال السماح بتثبيت التطبيقات من مصادر غير معروفة).
            Build: ${{ github.sha }}
          prerelease: false
          files: FullMark.apk
