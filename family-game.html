<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة العائلة — لاعبان</title>
<style>
  :root {
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --ink: #2B2440;
    --muted: #6E6787;
    --line: #E4DFD4;
    --board: #EFE9DE;
    --cell: #FDFBF7;
    --p1: #E85C6E;
    --p2: #1FA396;
    --p1-soft: #FBE3E7;
    --p2-soft: #DCF2EF;
    --gold: #D9942A;
    --shadow: 0 10px 30px rgba(43, 36, 64, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1727;
      --surface: #262033;
      --ink: #F2EEF8;
      --muted: #A79FC0;
      --line: #3A3350;
      --board: #221C31;
      --cell: #2E2740;
      --p1: #FF7D8E;
      --p2: #35C9BB;
      --p1-soft: #47303C;
      --p2-soft: #24413F;
      --gold: #F0B653;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1727;
    --surface: #262033;
    --ink: #F2EEF8;
    --muted: #A79FC0;
    --line: #3A3350;
    --board: #221C31;
    --cell: #2E2740;
    --p1: #FF7D8E;
    --p2: #35C9BB;
    --p1-soft: #47303C;
    --p2-soft: #24413F;
    --gold: #F0B653;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", "Noto Sans Arabic", system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
  }
  #app {
    max-width: 30rem;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .masthead { text-align: center; padding-top: 0.5rem; }
  .masthead h1 {
    font-size: 1.8rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.5px;
    text-wrap: balance;
  }
  .masthead p { color: var(--muted); margin: 0.3rem 0 0; font-size: 0.9rem; }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 0.6rem;
  }
  .player-chip {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 1rem;
    padding: 0.6rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    box-shadow: var(--shadow);
    transition: border-color 0.25s, transform 0.25s;
  }
  .player-chip.turn { transform: translateY(-3px); }
  .player-chip[data-p="1"].turn { border-color: var(--p1); }
  .player-chip[data-p="2"].turn { border-color: var(--p2); }
  .player-chip .who {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; flex: none; }
  .player-chip[data-p="1"] .dot { background: var(--p1); }
  .player-chip[data-p="2"] .dot { background: var(--p2); }
  .player-chip input {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    padding: 0;
    outline: none;
    border-bottom: 1px dashed transparent;
  }
  .player-chip input:focus { border-bottom-color: var(--muted); }
  .wins {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .wins small { font-size: 0.7rem; font-weight: 600; color: var(--muted); margin-inline-start: 0.25rem; }
  .vs {
    align-self: center;
    color: var(--muted);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .tabs { display: flex; gap: 0.5rem; }
  .tabs button {
    flex: 1;
    padding: 0.65rem 0.4rem;
    border: 2px solid var(--line);
    border-radius: 0.9rem;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tabs button:hover { border-color: var(--muted); }
  .tabs button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .tabs button.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .stage {
    background: var(--surface);
    border-radius: 1.4rem;
    padding: 1.1rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .status {
    text-align: center;
    font-weight: 700;
    min-height: 1.5em;
  }
  .status .name1 { color: var(--p1); }
  .status .name2 { color: var(--p2); }
  .status .draw { color: var(--gold); }

  .board-ttt {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.55rem;
    background: var(--board);
    border-radius: 1rem;
    padding: 0.55rem;
  }
  .board-ttt button {
    aspect-ratio: 1;
    border: none;
    border-radius: 0.8rem;
    background: var(--cell);
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s, transform 0.1s;
  }
  .board-ttt button:not(:disabled):hover { transform: scale(1.04); }
  .board-ttt button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .board-ttt button.x { color: var(--p1); }
  .board-ttt button.o { color: var(--p2); }
  .board-ttt button.win-cell { background: var(--gold); color: var(--bg); }

  .board-c4 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.4rem;
    background: var(--board);
    border-radius: 1rem;
    padding: 0.55rem;
  }
  .c4-col { display: flex; flex-direction: column; gap: 0.4rem; cursor: pointer; border: none; background: transparent; padding: 0; }
  .c4-col:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 0.5rem; }
  .c4-cell {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--cell);
    transition: background 0.2s;
  }
  .c4-cell.f1 { background: var(--p1); }
  .c4-cell.f2 { background: var(--p2); }
  .c4-cell.win-cell { box-shadow: 0 0 0 3px var(--gold) inset, 0 0 0 1px var(--gold); }
  @keyframes drop {
    from { transform: translateY(-300%); }
    to { transform: translateY(0); }
  }
  .c4-cell.dropped { animation: drop 0.3s cubic-bezier(0.3, 0, 0.6, 1.2); }

  .board-mem {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }
  .mem-card {
    aspect-ratio: 1;
    border: none;
    border-radius: 0.8rem;
    background: var(--board);
    font-size: 2rem;
    cursor: pointer;
    perspective: 400px;
    position: relative;
    transition: transform 0.1s;
  }
  .mem-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .mem-card .face {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    border-radius: 0.8rem;
    backface-visibility: hidden;
    transition: transform 0.35s;
  }
  .mem-card .back {
    background: var(--cell);
    border: 2px solid var(--line);
    color: var(--muted);
    font-size: 1.1rem;
    font-weight: 800;
  }
  .mem-card .front {
    background: var(--surface);
    border: 2px solid var(--line);
    transform: rotateY(180deg);
  }
  .mem-card.open .back { transform: rotateY(-180deg); }
  .mem-card.open .front { transform: rotateY(0); }
  .mem-card.matched-1 .front { border-color: var(--p1); background: var(--p1-soft); }
  .mem-card.matched-2 .front { border-color: var(--p2); background: var(--p2-soft); }
  .mem-score {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    font-weight: 700;
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .mem-score .s1 { color: var(--p1); }
  .mem-score .s2 { color: var(--p2); }

  .actions { display: flex; justify-content: center; }
  .btn {
    border: none;
    border-radius: 0.9rem;
    padding: 0.7rem 1.6rem;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    background: var(--ink);
    color: var(--bg);
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--muted); border: 2px solid var(--line); }

  .hint { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 15, 35, 0.55);
    display: grid;
    place-items: center;
    padding: 1rem;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .card-win {
    background: var(--surface);
    color: var(--ink);
    border-radius: 1.4rem;
    padding: 2rem 2.4rem;
    text-align: center;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 22rem;
  }
  .card-win h2 { margin: 0; font-size: 1.6rem; text-wrap: balance; }
  .card-win .trophy { font-size: 3rem; line-height: 1; }

  .confetti-bit {
    position: fixed;
    top: -2vh;
    width: 0.6rem;
    height: 0.9rem;
    z-index: 20;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti-bit, .c4-cell.dropped { animation: none; }
    .mem-card .face { transition: none; }
    .btn:hover, .player-chip.turn, .board-ttt button:not(:disabled):hover { transform: none; }
  }
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="masthead">
    <h1>ليلة اللعب العائلية</h1>
    <p>ثلاث ألعاب للاعبَين على جهاز واحد — مرّرا الجهاز بينكما</p>
  </header>

  <section class="scoreboard" aria-label="لوحة النتائج">
    <div class="player-chip" data-p="1" id="chip1">
      <span class="who"><span class="dot"></span><input id="name1" value="اللاعب الأول" aria-label="اسم اللاعب الأول" maxlength="14"></span>
      <span class="wins"><span id="wins1">0</span><small>فوز</small></span>
    </div>
    <span class="vs">ضدّ</span>
    <div class="player-chip" data-p="2" id="chip2">
      <span class="who"><span class="dot"></span><input id="name2" value="اللاعب الثاني" aria-label="اسم اللاعب الثاني" maxlength="14"></span>
      <span class="wins"><span id="wins2">0</span><small>فوز</small></span>
    </div>
  </section>

  <nav class="tabs" aria-label="اختيار اللعبة">
    <button id="tab-ttt" class="active">إكس – أو</button>
    <button id="tab-c4">أربعة تربح</button>
    <button id="tab-mem">الذاكرة</button>
  </nav>

  <!-- إكس أو -->
  <section class="stage" id="stage-ttt">
    <p class="status" id="status-ttt"></p>
    <div class="board-ttt" id="board-ttt" role="grid" aria-label="لوحة إكس أو"></div>
    <div class="actions"><button class="btn ghost" id="reset-ttt">جولة جديدة</button></div>
  </section>

  <!-- أربعة تربح -->
  <section class="stage" id="stage-c4" hidden>
    <p class="status" id="status-c4"></p>
    <div class="board-c4" id="board-c4" aria-label="لوحة أربعة تربح"></div>
    <p class="hint">اضغط على أي عمود لإسقاط قرصك — أول من يصفّ أربعة أقراص يفوز</p>
    <div class="actions"><button class="btn ghost" id="reset-c4">جولة جديدة</button></div>
  </section>

  <!-- الذاكرة -->
  <section class="stage" id="stage-mem" hidden>
    <p class="status" id="status-mem"></p>
    <div class="mem-score"><span class="s1" id="mem-s1"></span><span class="s2" id="mem-s2"></span></div>
    <div class="board-mem" id="board-mem" aria-label="لوحة الذاكرة"></div>
    <p class="hint">اقلبا بطاقتين في كل دور — من يجد زوجًا متطابقًا يلعب دورًا إضافيًا</p>
    <div class="actions"><button class="btn ghost" id="reset-mem">جولة جديدة</button></div>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card-win" role="alertdialog" aria-labelledby="win-title">
      <div class="trophy" id="win-emoji">🏆</div>
      <h2 id="win-title"></h2>
      <button class="btn" id="win-again">جولة جديدة</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------- الأسماء والنتائج (محفوظة محليًا) ---------- */
  const store = { names: "fg2_names", score: "fg2_score" };
  let names = { 1: "اللاعب الأول", 2: "اللاعب الثاني" };
  let score = { 1: 0, 2: 0 };
  try {
    const n = JSON.parse(localStorage.getItem(store.names) || "null");
    const s = JSON.parse(localStorage.getItem(store.score) || "null");
    if (n && n[1] && n[2]) names = n;
    if (s && typeof s[1] === "number") score = s;
  } catch (e) { /* التخزين غير متاح — نتابع بدون حفظ */ }

  function saveState() {
    try {
      localStorage.setItem(store.names, JSON.stringify(names));
      localStorage.setItem(store.score, JSON.stringify(score));
    } catch (e) { /* تجاهل */ }
  }
  function renderScore() {
    $("wins1").textContent = score[1];
    $("wins2").textContent = score[2];
  }
  function playerName(p) { return names[p]; }
  function nameSpan(p) {
    return '<span class="name' + p + '">' + escapeHtml(playerName(p)) + "</span>";
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  [1, 2].forEach((p) => {
    const input = $("name" + p);
    input.value = names[p];
    input.addEventListener("input", () => {
      names[p] = input.value.trim() || (p === 1 ? "اللاعب الأول" : "اللاعب الثاني");
      saveState();
      refreshAllStatus();
    });
  });

  function setTurnChip(p) {
    $("chip1").classList.toggle("turn", p === 1);
    $("chip2").classList.toggle("turn", p === 2);
  }

  /* ---------- الفوز والاحتفال ---------- */
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(p) {
    if (reducedMotion) return;
    const styles = getComputedStyle(document.documentElement);
    const colors = p === 0
      ? [styles.getPropertyValue("--gold"), styles.getPropertyValue("--p1"), styles.getPropertyValue("--p2")]
      : [styles.getPropertyValue("--p" + p), styles.getPropertyValue("--gold")];
    for (let i = 0; i < 70; i++) {
      const bit = document.createElement("div");
      bit.className = "confetti-bit";
      bit.style.left = Math.random() * 100 + "vw";
      bit.style.background = colors[i % colors.length];
      bit.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
      bit.style.animationDelay = Math.random() * 0.4 + "s";
      bit.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      document.body.appendChild(bit);
      setTimeout(() => bit.remove(), 4000);
    }
  }
  let overlayAction = null;
  function celebrate(winner, restartFn) {
    if (winner) {
      score[winner]++;
      saveState();
      renderScore();
      $("win-emoji").textContent = "🏆";
      $("win-title").innerHTML = "مبروك يا " + nameSpan(winner) + "!";
    } else {
      $("win-emoji").textContent = "🤝";
      $("win-title").innerHTML = '<span class="draw">تعادل!</span> جولة أخرى؟';
    }
    confetti(winner || 0);
    overlayAction = restartFn;
    $("overlay").hidden = false;
    $("win-again").focus();
  }
  $("win-again").addEventListener("click", () => {
    $("overlay").hidden = true;
    if (overlayAction) overlayAction();
  });
  $("overlay").addEventListener("click", (e) => {
    if (e.target === $("overlay")) {
      $("overlay").hidden = true;
      if (overlayAction) overlayAction();
    }
  });

  /* ---------- التبويبات ---------- */
  const games = ["ttt", "c4", "mem"];
  games.forEach((g) => {
    $("tab-" + g).addEventListener("click", () => {
      games.forEach((x) => {
        $("tab-" + x).classList.toggle("active", x === g);
        $("stage-" + x).hidden = x !== g;
      });
      refreshAllStatus();
    });
  });

  /* ---------- 1) إكس أو ---------- */
  const ttt = { board: Array(9).fill(0), turn: 1, done: false };
  const tttLines = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];
  const tttBoard = $("board-ttt");
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.setAttribute("aria-label", "الخانة " + (i + 1));
    b.addEventListener("click", () => tttPlay(i));
    tttBoard.appendChild(b);
  }
  function tttPlay(i) {
    if (ttt.done || ttt.board[i]) return;
    ttt.board[i] = ttt.turn;
    const cell = tttBoard.children[i];
    cell.textContent = ttt.turn === 1 ? "✕" : "◯";
    cell.classList.add(ttt.turn === 1 ? "x" : "o");
    const line = tttLines.find((l) => l.every((j) => ttt.board[j] === ttt.turn));
    if (line) {
      ttt.done = true;
      line.forEach((j) => tttBoard.children[j].classList.add("win-cell"));
      celebrate(ttt.turn, tttReset);
      return;
    }
    if (ttt.board.every(Boolean)) {
      ttt.done = true;
      celebrate(0, tttReset);
      return;
    }
    ttt.turn = ttt.turn === 1 ? 2 : 1;
    tttStatus();
  }
  function tttStatus() {
    $("status-ttt").innerHTML = "دور " + nameSpan(ttt.turn) + " (" + (ttt.turn === 1 ? "✕" : "◯") + ")";
    setTurnChip(ttt.turn);
  }
  function tttReset() {
    ttt.board.fill(0);
    ttt.done = false;
    ttt.turn = ttt.turn === 1 ? 2 : 1; /* الخاسر أو التالي يبدأ */
    [...tttBoard.children].forEach((c) => { c.textContent = ""; c.className = ""; });
    tttStatus();
  }
  $("reset-ttt").addEventListener("click", tttReset);

  /* ---------- 2) أربعة تربح ---------- */
  const C4 = { rows: 6, cols: 7, board: [], turn: 1, done: false };
  const c4Board = $("board-c4");
  function c4Build() {
    C4.board = Array.from({ length: C4.rows }, () => Array(C4.cols).fill(0));
    C4.done = false;
    c4Board.innerHTML = "";
    for (let c = 0; c < C4.cols; c++) {
      const col = document.createElement("button");
      col.className = "c4-col";
      col.setAttribute("aria-label", "العمود " + (c + 1));
      for (let r = 0; r < C4.rows; r++) {
        const cell = document.createElement("div");
        cell.className = "c4-cell";
        col.appendChild(cell);
      }
      col.addEventListener("click", () => c4Drop(c));
      c4Board.appendChild(col);
    }
    c4Status();
  }
  function c4Drop(c) {
    if (C4.done) return;
    let r = -1;
    for (let i = C4.rows - 1; i >= 0; i--) {
      if (!C4.board[i][c]) { r = i; break; }
    }
    if (r < 0) return;
    C4.board[r][c] = C4.turn;
    const cell = c4Board.children[c].children[r];
    cell.classList.add("f" + C4.turn, "dropped");
    const win = c4Win(r, c);
    if (win) {
      C4.done = true;
      win.forEach(([wr, wc]) => c4Board.children[wc].children[wr].classList.add("win-cell"));
      celebrate(C4.turn, c4Build);
      return;
    }
    if (C4.board.every((row) => row.every(Boolean))) {
      C4.done = true;
      celebrate(0, c4Build);
      return;
    }
    C4.turn = C4.turn === 1 ? 2 : 1;
    c4Status();
  }
  function c4Win(r, c) {
    const p = C4.board[r][c];
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const cells = [[r, c]];
      for (const sign of [1, -1]) {
        let nr = r + dr * sign, nc = c + dc * sign;
        while (nr >= 0 && nr < C4.rows && nc >= 0 && nc < C4.cols && C4.board[nr][nc] === p) {
          cells.push([nr, nc]);
          nr += dr * sign;
          nc += dc * sign;
        }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }
  function c4Status() {
    $("status-c4").innerHTML = "دور " + nameSpan(C4.turn) + " — أسقط قرصك";
    setTurnChip(C4.turn);
  }
  $("reset-c4").addEventListener("click", () => { C4.turn = C4.turn === 1 ? 2 : 1; c4Build(); });

  /* ---------- 3) الذاكرة ---------- */
  const EMOJI = ["🐱", "🐶", "🦊", "🐼", "🐸", "🦁", "🐰", "🐵"];
  const MEM = { deck: [], open: [], lock: false, turn: 1, pairs: { 1: 0, 2: 0 }, matched: 0 };
  const memBoard = $("board-mem");
  function memBuild() {
    MEM.deck = [...EMOJI, ...EMOJI]
      .map((e) => ({ e, key: Math.random() }))
      .sort((a, b) => a.key - b.key)
      .map((x) => x.e);
    MEM.open = [];
    MEM.lock = false;
    MEM.pairs = { 1: 0, 2: 0 };
    MEM.matched = 0;
    memBoard.innerHTML = "";
    MEM.deck.forEach((emoji, i) => {
      const card = document.createElement("button");
      card.className = "mem-card";
      card.setAttribute("aria-label", "بطاقة " + (i + 1));
      card.innerHTML = '<span class="face back">؟</span><span class="face front">' + emoji + "</span>";
      card.addEventListener("click", () => memFlip(i));
      memBoard.appendChild(card);
    });
    memStatus();
  }
  function memFlip(i) {
    const card = memBoard.children[i];
    if (MEM.lock || MEM.open.includes(i) || card.classList.contains("matched-1") || card.classList.contains("matched-2")) return;
    card.classList.add("open");
    MEM.open.push(i);
    if (MEM.open.length < 2) return;
    const [a, b] = MEM.open;
    if (MEM.deck[a] === MEM.deck[b]) {
      memBoard.children[a].classList.add("matched-" + MEM.turn);
      memBoard.children[b].classList.add("matched-" + MEM.turn);
      MEM.pairs[MEM.turn]++;
      MEM.matched++;
      MEM.open = [];
      memStatus();
      if (MEM.matched === EMOJI.length) {
        const w = MEM.pairs[1] === MEM.pairs[2] ? 0 : (MEM.pairs[1] > MEM.pairs[2] ? 1 : 2);
        celebrate(w, memBuild);
      }
    } else {
      MEM.lock = true;
      setTimeout(() => {
        memBoard.children[a].classList.remove("open");
        memBoard.children[b].classList.remove("open");
        MEM.open = [];
        MEM.lock = false;
        MEM.turn = MEM.turn === 1 ? 2 : 1;
        memStatus();
      }, 900);
    }
  }
  function memStatus() {
    $("status-mem").innerHTML = "دور " + nameSpan(MEM.turn) + " — اقلب بطاقتين";
    $("mem-s1").textContent = playerName(1) + ": " + MEM.pairs[1] + " زوج";
    $("mem-s2").textContent = playerName(2) + ": " + MEM.pairs[2] + " زوج";
    setTurnChip(MEM.turn);
  }
  $("reset-mem").addEventListener("click", memBuild);

  /* ---------- تحديث عام ---------- */
  function refreshAllStatus() {
    tttStatus();
    c4Status();
    memStatus();
    if (!$("stage-ttt").hidden) setTurnChip(ttt.turn);
    else if (!$("stage-c4").hidden) setTurnChip(C4.turn);
    else setTurnChip(MEM.turn);
  }

  renderScore();
  tttStatus();
  c4Build();
  memBuild();
})();
</script>
</body>
</html>
