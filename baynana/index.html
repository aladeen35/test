<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3C0F20">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بيننا — صراحة وجرأة للمتزوجين</title>
<style>
/* الخط الرسمي — نوتو كوفي عربي، مضمّن محليًا ليعمل دون اتصال */
@font-face{
  font-family:"Noto Kufi Arabic";
  src:url("fonts/NotoKufiArabic-Regular.ttf") format("truetype");
  font-weight:100 900;
  font-display:swap;
}
/* ═══════════ «دفتر المخمل» — نبيذي عميق، ورق عاجي، ذهب عتيق، وقصاصات مائلة ═══════════ */
:root{
  --velvet:#3C0F20;
  --velvet-2:#55152A;
  --velvet-3:#2A0614;
  --velvet-panel:rgba(42,4,18,.45);
  --paper:#F7F0E4;
  --paper-2:#EFE0C2;
  --paper-ink:#482329;
  --paper-soft:#8A6860;
  --maroon:#6D2034;
  --maroon-deep:#541526;
  --gold:#E2B769;
  --gold-hi:#F6D69A;
  --gold-dim:#B98D59;
  --gold-line:rgba(242,207,138,.25);
  --ink:#F6EBD4;
  --ink-soft:#DFBF82;
  --him:#C9556A;  --him-soft:#F4DCE1;
  --her:#4B7358;  --her-soft:#DCEADF;
  /* فئات بدرجات عتيقة مطفأة — من عجلة التصميم */
  --c-truth:#344C78;  --c-gesture:#A8546E; --c-passion:#B76F3A;
  --c-deep:#6D2034;   --c-laugh:#4B7358;   --c-relax:#765E83;  --c-surprise:#9F7750;
  --shadow:0 16px 32px rgba(18,1,7,.35);
  --shadow-lg:0 30px 48px rgba(9,1,4,.45);
  /* حواف ورق ممزق */
  --torn:polygon(0 0,96% 0,100% 5%,99% 94%,94% 100%,2% 99%,0 95%);
  --torn2:polygon(0 2%,100% 0,97% 97%,5% 100%,0 94%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--velvet)}
body{
  font-family:"Noto Kufi Arabic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1000px 600px at 50% -10%, rgba(226,183,105,.10), transparent 60%),
    radial-gradient(800px 520px at 8% 108%, rgba(109,32,52,.55), transparent 60%),
    linear-gradient(165deg,#4A1226,var(--velvet) 45%,var(--velvet-3));
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--paper-ink)}

/* غبار ذهبي خافت كما في تصميم المخمل */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.38;
  background-image:
    radial-gradient(circle at 18% 16%, rgba(239,190,110,.13) 0 1px, transparent 1.7px),
    radial-gradient(circle at 78% 81%, rgba(255,236,191,.13) 0 1px, transparent 1.7px);
  background-size:38px 42px,56px 64px;
}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 16px 116px}

/* ═══ لوح ورقي بقصاصة ممزقة وشريط لاصق ═══ */
.paper{
  position:relative;color:var(--paper-ink);
  background:
    linear-gradient(140deg,rgba(253,246,231,.98),rgba(239,224,194,.94)),
    repeating-linear-gradient(2deg,transparent 0 6px,rgba(126,63,45,.025) 6px 7px),
    repeating-linear-gradient(88deg,transparent 0 9px,rgba(126,63,45,.02) 9px 10px);
  background-color:var(--paper);
  border:1px solid rgba(236,207,149,.82);
  clip-path:var(--torn);
  box-shadow:var(--shadow), inset 0 0 0 4px rgba(126,63,45,.035);
  padding:18px 16px;margin-top:16px;
}
.paper::after{
  content:"";position:absolute;top:0;inset-inline-end:22px;width:38px;height:6px;
  background:rgba(178,127,63,.38);transform:rotate(1deg);
}
.paper.tilt-l{transform:rotate(-.5deg)}
.paper.tilt-r{transform:rotate(.55deg)}
.paper h3{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--maroon)}
.paper p{font-size:.88rem;line-height:1.9;color:var(--paper-soft)}

/* لوح مخملي شفاف */
.velvetp{
  background:var(--velvet-panel);backdrop-filter:blur(8px);
  border:1px solid var(--gold-line);border-radius:6px;
  padding:16px;margin-top:16px;
}

/* ═══ ترويسة ═══ */
header.top{display:flex;align-items:center;gap:12px;padding:18px 2px 6px}
header.top .brand{flex:1;min-width:0}
header.top .eyebrow{color:#EAC987;letter-spacing:.055em;font-size:.68rem;font-weight:600;margin-bottom:2px}
header.top .brand b{font-size:1.35rem;font-weight:800;color:#FFF1D2}
header.top .brand b span{color:#E3BE76;font-size:.6em;font-weight:400;margin-inline-start:6px}
.private-pill{display:flex;align-items:center;gap:6px;color:#E7C777;font-size:.7rem;font-weight:600}
.private-pill i{width:6px;height:6px;border-radius:50%;background:#D8B55E}

/* ═══ خانات صور الزوجين ═══ */
.pslot{
  position:relative;border-radius:50%;overflow:hidden;flex:none;
  background:radial-gradient(circle at 40% 30%,var(--velvet-2),var(--velvet-3));
  display:grid;place-items:center;
}
.pslot img{width:100%;height:100%;object-fit:cover;object-position:top;display:none}
.pslot.loaded img{display:block}
.pslot .ph{font-size:calc(var(--ps,56px)*.5);line-height:1}
.pslot.loaded .ph{display:none}
.pslot.him{border:3px solid var(--him);box-shadow:0 4px 14px rgba(201,85,106,.4)}
.pslot.her{border:3px solid var(--her);box-shadow:0 4px 14px rgba(75,115,88,.4)}
.pslot.sm{width:40px;height:40px;--ps:40px;border-width:2.5px}
.pslot.md{width:56px;height:56px;--ps:56px}
.pslot.lg{width:96px;height:96px;--ps:96px;border-width:4px}
.pslot.xl{width:120px;height:120px;--ps:120px;border-width:5px}

/* ═══ الرئيسية ═══ */
.hero{text-align:center;padding:14px 0 4px}
.hero .logo-img{
  width:min(84%,360px);display:block;margin:0 auto;border-radius:22px;
  border:1px solid var(--gold-line);
  filter:drop-shadow(0 18px 36px rgba(9,1,4,.6));
}
.hero .duo{display:none;justify-content:center;align-items:flex-end;margin-bottom:6px}
.hero .duo .pslot:first-child{margin-inline-end:-22px;z-index:2;transform:rotate(-6deg)}
.hero .duo .pslot:last-child{transform:rotate(6deg)}
.hero h1{display:none;font-size:3rem;font-weight:800;color:#FFF1D2;text-shadow:0 4px 14px rgba(226,183,105,.35)}
.hero.nologo .duo{display:flex}
.hero.nologo h1{display:block}
.hero.nologo .logo-img{display:none}
.hero .tag{
  display:inline-block;background:rgba(42,4,18,.4);border:1px solid var(--gold-line);
  border-radius:3px;padding:8px 20px;margin-top:14px;
  font-weight:600;font-size:.85rem;color:var(--gold-hi);
}
.hero .sub{margin-top:10px;font-size:.75rem;color:var(--ink-soft);font-weight:500;line-height:1.9}

/* ═══ أزرار ═══ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:48px;padding:13px 16px;font-size:1rem;font-weight:800;
  border:1px solid transparent;transition:transform .18s, box-shadow .18s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.primary{
  color:#FFF2D4;background:var(--maroon);border-color:rgba(255,242,212,.14);
  box-shadow:0 7px 14px rgba(90,23,39,.35), 5px 6px 0 rgba(20,2,9,.28);
}
.btn.gold{
  color:#541526;background:linear-gradient(145deg,#F7ECD5,#E9D4A8);border-color:#E4BF79;
  box-shadow:0 7px 14px rgba(20,2,9,.3), 5px 6px 0 rgba(64,10,27,.3);
}
.btn.sec{
  color:#60343A;background:rgba(255,250,238,.9);border-color:var(--gold-dim);
}
.btn.quiet{
  color:#FFEDC8;background:rgba(42,4,18,.25);border-color:rgba(249,225,177,.24);font-size:.85rem;
}
.btn.ghost{background:transparent;border:1px dashed rgba(245,214,151,.4);color:var(--ink-soft);font-size:.85rem;min-height:42px}
.btnrow{display:flex;gap:10px;margin-top:10px}

/* ═══ رموز الأمان ═══ */
.safety{display:flex;gap:6px;margin-top:14px}
.safety button{
  flex:1;padding:10px 4px;font-weight:800;font-size:.8rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s;
}
.safety button:active{transform:scale(.95)}
.safety .go{background:rgba(255,255,255,.07);border:1px dashed rgba(75,115,88,.65);color:#9CC7A9}
.safety .slow{background:rgba(255,255,255,.05);border:1px dashed rgba(183,111,58,.65);color:#E8B77E}
.safety .skip{background:rgba(255,255,255,.05);border:1px dashed rgba(201,85,106,.65);color:#E89AA8}
.safety button span{font-size:1.05rem}
.safety button small{font-weight:500;font-size:.58rem;opacity:.75}

/* ═══ اختيار المستوى ═══ */
.lvls{display:grid;gap:6px;margin-top:12px}
.lvl{
  display:flex;align-items:center;gap:12px;background:transparent;
  border:1px solid transparent;padding:12px 10px;transition:.18s;text-align:start;color:#60383A;
}
.lvl.on{background:rgba(109,32,52,.09);border-color:rgba(109,32,52,.25);color:var(--maroon)}
.lvl .ic{font-size:1.6rem;flex:none}
.lvl b{font-size:.98rem;font-weight:800;display:block}
.lvl small{font-size:.74rem;color:var(--paper-soft);line-height:1.6;display:block;margin-top:2px}
.lvl .chk{
  margin-inline-start:auto;width:22px;height:22px;border-radius:50%;flex:none;
  border:1px solid var(--gold-dim);display:grid;place-items:center;color:transparent;font-size:.7rem;
}
.lvl.on .chk{background:var(--maroon);border-color:var(--maroon);color:#FFF0D3}

/* ═══ شبكة الأنماط ═══ */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mode{
  position:relative;color:var(--paper-ink);text-align:center;
  background:linear-gradient(140deg,rgba(253,246,231,.97),rgba(239,224,194,.93));
  border:1px solid rgba(236,207,149,.82);clip-path:var(--torn);
  box-shadow:var(--shadow);padding:18px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:transform .18s;
}
.mode:nth-child(odd){transform:rotate(-.6deg)}
.mode:nth-child(even){transform:rotate(.5deg)}
.mode:hover{transform:translateY(-3px) rotate(0)}
.mode .ic{font-size:1.9rem}
.mode b{font-size:.95rem;font-weight:800;color:var(--maroon)}
.mode small{font-size:.7rem;color:var(--paper-soft);line-height:1.6}
.mode.wide{grid-column:1/-1;flex-direction:row;text-align:start}
.mode.wide .txt{flex:1}

/* ═══ فئات البطاقات ═══ */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.catb{
  position:relative;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:#FFF5E0;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.25);
  border:1px solid rgba(255,245,224,.22);clip-path:var(--torn2);
  box-shadow:6px 8px 0 rgba(20,2,9,.25);
  transition:transform .15s;
}
.catb:nth-child(odd){transform:rotate(-.7deg)}
.catb:nth-child(even){transform:rotate(.6deg)}
.catb:active{transform:scale(.95)}
.catb .ic{font-size:1.6rem;text-shadow:none}
.catb b{font-size:.92rem}
.catb small{font-size:.62rem;opacity:.85;font-weight:500}
.catb.off{opacity:.35;filter:grayscale(.7)}
.catb .lock{position:absolute;top:8px;inset-inline-end:12px;font-size:.8rem}

/* ═══ شاشة اللعب ═══ */
.playtop{display:flex;align-items:center;gap:10px;padding:14px 2px 4px}
.playtop .back{
  width:42px;height:42px;border:1px solid var(--gold-line);background:rgba(42,4,18,.3);
  display:grid;place-items:center;font-size:1.1rem;flex:none;color:var(--gold-hi);border-radius:3px;
}
.playtop .tt b{font-size:1.05rem;color:#FFF1D2;font-weight:800}
.playtop .tt small{display:block;font-size:.65rem;color:var(--ink-soft);font-weight:500}
.turnchip{
  display:flex;align-items:center;gap:9px;background:rgba(42,4,18,.35);border:1px solid var(--gold-line);
  border-radius:999px;padding:5px 14px 5px 5px;margin-inline-start:auto;
}
.turnchip b{font-size:.85rem;font-weight:800;color:var(--gold-hi)}
.turnchip small{display:block;font-size:.6rem;color:var(--ink-soft)}

/* البطاقة الرئيسية — ورق عاجي بإطار ذهبي مزدوج وظل قصاصات مكدسة */
.stage{perspective:1500px;margin-top:16px}
.flip{position:relative;width:100%;min-height:500px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.15,.25,1.08)}
.flip.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;
}
/* ظهر البطاقة: مخمل + إطار صورة الشريك */
.face.backside{
  justify-content:center;gap:14px;padding:26px;cursor:pointer;
  background:linear-gradient(135deg,rgba(76,16,34,.96),rgba(47,4,18,.92));
  border:1px solid rgba(244,216,160,.3);
  box-shadow:var(--shadow-lg);
}
.face.backside::before{
  content:"";position:absolute;inset:11px;pointer-events:none;
  border:1px dashed rgba(242,207,138,.35);
}
.face.backside .frame{
  padding:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8A2B44,var(--maroon-deep));
  border:1px solid var(--gold);
  box-shadow:0 10px 26px rgba(9,1,4,.5), inset 0 0 0 3px rgba(226,183,105,.25);
}
.face.backside .who{font-size:1.35rem;font-weight:800;color:#FFF1D2}
.face.backside .hint{
  background:rgba(247,240,228,.95);border-radius:2px;padding:8px 22px;font-weight:700;font-size:.85rem;color:#482329;
  transform:rotate(-.8deg);box-shadow:3px 4px 0 rgba(20,2,9,.3);
  animation:pulse 1.7s infinite;
}
@keyframes pulse{0%,100%{transform:rotate(-.8deg) scale(1)}50%{transform:rotate(-.8deg) scale(1.05)}}
/* وجه البطاقة الورقي */
.face.front{
  transform:rotateY(180deg);color:var(--paper-ink);text-align:center;
  background:
    linear-gradient(rgba(249,243,231,.9),rgba(247,240,228,.95)),
    repeating-linear-gradient(3deg,transparent 0 7px,rgba(126,63,45,.03) 7px 8px);
  background-color:var(--paper);
  border:1px solid #D8B56C;
  box-shadow:0 30px 48px rgba(9,1,4,.4), 14px 16px 0 rgba(20,2,9,.22), 7px 9px 0 #EAD9B8;
}
.face.front::before{
  content:"";position:absolute;inset:10px;pointer-events:none;
  border:1px solid rgba(226,183,105,.75);box-shadow:inset 0 0 0 4px rgba(255,255,255,.25);opacity:.7;
}
.face.front .chead{
  width:100%;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  position:relative;z-index:1;
}
.face.front .seal{
  color:#FFF5E0;background:var(--accent,var(--maroon));padding:6px 13px;border-radius:999px;
  font-weight:700;font-size:.75rem;box-shadow:0 3px 7px rgba(53,15,17,.25);
  display:flex;align-items:center;gap:6px;
}
.face.front .lvltag{color:#875C51;font-size:.66rem;font-weight:600}
.face.front .divider{
  width:150px;height:1px;margin:10px auto 0;
  background:linear-gradient(90deg,transparent,var(--accent,var(--gold)),transparent);
}
.face.front .ctext{
  flex:1;display:grid;place-items:center;padding:16px 26px;width:100%;
  font-size:1.16rem;font-weight:700;line-height:2.05;position:relative;z-index:1;
}
.face.front .calt{
  width:calc(100% - 44px);margin:0 22px 6px;padding:10px 14px;text-align:start;
  border-inline-start:3px solid var(--accent,var(--gold-dim));background:rgba(218,186,123,.18);
  transform:rotate(-.5deg);position:relative;z-index:1;
}
.face.front .calt b{color:#7B5550;font-size:.68rem;font-weight:700;display:block}
.face.front .calt p{color:#543239;font-size:.85rem;line-height:1.7;margin-top:2px}

/* ═══ حكم الشريك + العقوبة ═══ */
.judge{
  width:calc(100% - 32px);margin:4px 16px 14px;position:relative;z-index:1;
  border-top:1px dashed rgba(156,91,54,.4);padding-top:11px;
}
.judge .jhead{
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:#7A4F47;font-weight:700;font-size:.78rem;margin-bottom:9px;
}
.judge .jbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge .jbtns button{
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-weight:800;font-size:.8rem;border:1px solid transparent;transition:transform .15s;padding:4px 8px;
}
.judge .jbtns button:active{transform:scale(.96)}
.judge .ok{color:#FFF2D4;background:var(--maroon);box-shadow:0 6px 12px rgba(90,23,39,.3)}
.judge .oops{color:#60343A;border-color:var(--gold-dim);background:rgba(255,250,238,.62)}

/* قصاصة العقوبة */
.penalty{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:26px 22px;text-align:center;color:var(--paper-ink);
  background:
    linear-gradient(150deg,rgba(252,242,222,.99),rgba(240,222,186,.97)),
    repeating-linear-gradient(-3deg,transparent 0 8px,rgba(126,63,45,.04) 8px 9px);
  border:1px solid #D8B56C;clip-path:var(--torn2);
  box-shadow:var(--shadow-lg);
  transform:rotate(-1deg) scale(.6);opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.25), opacity .25s;
}
.penalty.show{transform:rotate(-1deg) scale(1);opacity:1;pointer-events:auto}
.penalty .ptag{
  color:#FFF5E0;background:var(--c-passion);padding:6px 16px;border-radius:999px;
  font-weight:800;font-size:.8rem;box-shadow:0 3px 7px rgba(53,15,17,.25);transform:rotate(1.5deg);
}
.penalty h4{font-size:.72rem;color:#966D5B;font-weight:600;letter-spacing:.02em}
.penalty .ptext{font-size:1.1rem;font-weight:800;line-height:2;max-width:400px;color:#543239}
.penalty .pbtns{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;max-width:380px;margin-top:6px}
.penalty .pbtns .done{
  min-height:46px;color:#FFF2D4;background:var(--maroon);font-weight:800;font-size:.88rem;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 6px 12px rgba(90,23,39,.3);
}
.penalty .pbtns .redo{
  min-height:46px;padding:0 16px;color:#60343A;border:1px dashed var(--gold-dim);
  background:rgba(255,255,255,.4);font-weight:700;font-size:.82rem;
}
.penalty small{color:#8A6860;font-size:.66rem;line-height:1.7}

/* ═══ المؤقت ═══ */
.timerbox{text-align:center;padding:6px 0}
.timerbox .ring{
  width:158px;height:158px;border-radius:50%;margin:14px auto;position:relative;
  display:grid;place-items:center;
  background:conic-gradient(var(--gold) var(--pct,100%), rgba(109,32,52,.25) 0);
  box-shadow:0 10px 24px rgba(9,1,4,.35);
}
.timerbox .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#631B31;border:1px solid rgba(242,207,138,.5)}
.timerbox .ring b{position:relative;font-size:2.3rem;font-weight:800;color:#FBE9C0;direction:ltr}

/* ═══ العجلة ═══ */
.wheelwrap{position:relative;width:min(310px,80vw);margin:22px auto 8px}
.wheelptr{
  position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:24px solid var(--gold-hi);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
}
.wheel{
  width:100%;aspect-ratio:1;border-radius:50%;position:relative;
  border:6px dashed rgba(241,210,141,.55);
  box-shadow:inset 0 0 0 6px rgba(59,10,25,.8), var(--shadow-lg);
  transition:transform 4.2s cubic-bezier(.12,.6,.08,1);
}
.wheel .seg{
  position:absolute;top:50%;left:50%;transform-origin:0 0;
  font-weight:700;color:#FFF0CC;font-size:.88rem;text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.wheelhub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  width:62px;height:62px;border-radius:50%;background:#4D1023;
  border:1px solid rgba(242,207,138,.6);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:1.4rem;
}

/* ═══ الأبواب ═══ */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.door{
  aspect-ratio:.7;border:1px solid rgba(245,218,165,.28);
  background:rgba(255,255,255,.045);color:#FEECCA;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:.2s;position:relative;
}
.door::before{content:"";position:absolute;inset:7px;border:1px dashed rgba(245,218,165,.3)}
.door:hover{background:rgba(239,196,112,.15);transform:translateY(-3px)}
.door .ic{font-size:1.9rem}
.door b{font-size:.85rem;position:relative}

/* ═══ الدفتر والنجوم ═══ */
.starbar{
  display:flex;align-items:center;gap:5px;justify-content:center;margin-top:12px;font-size:1.35rem;
}
.starbar .s{filter:grayscale(1);opacity:.3;transition:all .3s}
.starbar .s.on{filter:none;opacity:1;transform:scale(1.1)}
.entry{position:relative;color:var(--paper-ink);
  background:linear-gradient(140deg,rgba(253,246,231,.97),rgba(239,224,194,.93));
  border:1px solid rgba(236,207,149,.82);clip-path:var(--torn);
  box-shadow:var(--shadow);padding:15px 16px;margin-top:12px;
}
.entry:nth-child(odd){transform:rotate(-.4deg)}
.entry time{font-size:.66rem;color:var(--paper-soft);font-weight:700}
.entry .row{display:flex;gap:8px;margin-top:7px;font-size:.85rem;line-height:1.8}
.entry .row .k{flex:none}
.field{margin-top:12px;text-align:start}
.field label{display:block;font-weight:800;font-size:.84rem;margin-bottom:6px;color:var(--maroon)}
.field input,.field textarea{
  width:100%;background:rgba(255,255,255,.55);border:1px solid var(--gold-dim);
  padding:11px 13px;font-size:.92rem;outline:none;resize:none;border-radius:2px;
}
.field input:focus,.field textarea:focus{border-color:var(--maroon)}
.field input::placeholder{color:#B09A85}

/* ═══ نافذة (ورقة فوق المخمل) ═══ */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal .bg{position:absolute;inset:0;background:rgba(27,2,10,.75);backdrop-filter:blur(8px)}
.modal .sheet{
  position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;
  color:var(--paper-ink);text-align:center;
  background:linear-gradient(150deg,rgba(252,244,228,.98),rgba(240,224,192,.96));
  border:1px solid #D8B56C;
  box-shadow:0 28px 65px rgba(0,0,0,.5), 10px 12px 0 rgba(20,2,9,.25);
  padding:26px 22px;transform:rotate(-.35deg);
  animation:up .3s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes up{from{transform:rotate(-.35deg) translateY(50px);opacity:0}}
.modal .sheet h3{color:var(--maroon)}

/* ═══ تنقل سفلي — ألسنة ورقية ═══ */
nav.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;pointer-events:none;
}
nav.bottom .row{
  pointer-events:auto;display:flex;gap:4px;width:100%;max-width:430px;
  background:rgba(34,6,16,.88);backdrop-filter:blur(10px);
  border:1px solid var(--gold-line);padding:7px;
  box-shadow:var(--shadow-lg);
}
nav.bottom button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;
  font-size:1.1rem;color:rgba(255,238,204,.6);border-bottom:2px dashed rgba(245,214,151,.25);
  transition:.18s;
}
nav.bottom button .lbl{font-size:.62rem;font-weight:800}
nav.bottom button.active{
  color:#4B1625;background:linear-gradient(145deg,#F7ECD5,#E9D4A8);
  border:1px solid #E4BF79;border-bottom:0;transform:rotate(-.45deg);
  box-shadow:3px -4px 0 rgba(64,10,27,.25);
}

.view{display:none;animation:fade .25s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.note{
  display:flex;gap:10px;background:rgba(42,4,18,.35);border:1px solid var(--gold-line);
  padding:12px 14px;margin-top:12px;font-size:.78rem;line-height:1.9;color:var(--ink-soft);text-align:start;
}
.note .ic{flex:none;font-size:1.05rem}
.note.onpaper{background:rgba(218,186,123,.16);border:1px dashed rgba(156,91,54,.35);color:var(--paper-soft)}
.pill{display:inline-block;background:rgba(218,186,123,.2);border-radius:2px;padding:4px 13px;font-size:.72rem;font-weight:700;color:#7A5550;margin:3px 2px;border:1px dashed rgba(156,91,54,.3)}
.center{text-align:center}
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:99;
  background:var(--paper);color:#482329;padding:11px 24px;font-weight:700;font-size:.85rem;
  border:1px solid #D8B56C;box-shadow:4px 5px 0 rgba(20,2,9,.3);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0) rotate(-.5deg)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-size:1.25rem;animation:drop 2.6s linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg);opacity:.4}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:640px){.flip{min-height:540px}.face.front .ctext{font-size:1.3rem}}
</style>
</head>

function pslot(who, size){
  const up = store("img-"+who);
  const src = up || ("img/"+(who==="him"?"husband":"wife")+".png");
  const ph = who==="him" ? "🤵" : "👰";
  return `<div class="pslot ${who} ${size}">
    <img src="${src}" onload="this.parentElement.classList.add('loaded')" onerror="this.remove()" alt="">
    <div class="ph">${ph}</div>
  </div>`;
}

/* سحب بطاقة دون تكرار حتى تنفد الفئة */
function draw(cat){
  const pool = DECK[cat].map((c,i)=>({...c,i})).filter(c=>c.l<=S.lvl);
  if(!pool.length) return null;
  S.used[cat] = S.used[cat]||[];
  let fresh = pool.filter(c=>!S.used[cat].includes(c.i));
  if(!fresh.length){S.used[cat]=[];fresh=pool;}
  const card = fresh[Math.floor(Math.random()*fresh.length)];
  S.used[cat].push(card.i);
  return card;
}
/* سحب عقوبة دون تكرار */
function drawPenalty(){
  let fresh = PENALTIES.map((p,i)=>i).filter(i=>!S.usedPen.includes(i));
  if(!fresh.length){S.usedPen=[];fresh=PENALTIES.map((p,i)=>i);}
  const i = fresh[Math.floor(Math.random()*fresh.length)];
  S.usedPen.push(i);
  return PENALTIES[i];
}

  <h3>${pslot(S.turn,"sm")} دور ${whoName(S.turn)} — اختر لون البطاقة</h3>
  <p style="font-size:.78rem">${S.played>0 && (S.played+1)%3===0 ? "💡 اقتراح: كل ثالث بطاقة من «قرب وشغف» أو «عمق خاص» حتى لا تظل الجلسة كلامية!" : "أحدكما يختار اللون، والآخر له حق تعديل المستوى — والحكم على التنفيذ لشريكك 😉"}</p>
</div>
<div class="cats">
  ${Object.entries(CATS).map(([k,c])=>{
    const locked = c.minLvl > S.lvl;
    return `<button class="catb ${locked?"off":""}" style="background:${c.color}" onclick="${locked?`toast('هذه الفئة تحتاج درجة ${LVLS[c.minLvl-1].name} — غيّراها من الإعدادات')`:`flipCard('${k}')`}">
      ${locked?'<span class="lock">🔒</span>':""}
      <span class="ic">${c.icon}</span><b>${c.name}</b><small>${c.desc}</small>
    </button>`;
  }).join("")}
</div>
<button class="btn ghost" style="margin-top:16px" onclick="endSession()">🌙 إنهاء الجلسة وتسجيلها في الدفتر</button>
`;

function playTop(sub){
  return `<div class="playtop">
    <button class="back" onclick="go('modes')">→</button>
    <div class="tt"><b>بيننا</b><small>${sub}</small></div>
    <div class="turnchip">${pslot(S.turn,"sm")}<span><b>${whoName(S.turn)}</b><small>صاحب الدور</small></span></div>
  </div>`;
}

/* ═══ عرض البطاقة ═══ */
window.flipCard = (cat) => {
  const card = draw(cat);
  if(!card) return toast("لا توجد بطاقات بهذا المستوى هنا");
  S.currentCard = card; S.currentCat = cat;
  const c = CATS[cat];
  const j = other();
  app.innerHTML = `
  ${playTop(c.name)}
  <div class="stage">
    <div class="flip" id="flip" onclick="this.classList.add('flipped')">
      <div class="face backside">
        <div class="frame">${pslot(S.turn,"xl")}</div>
        <div class="who">بطاقة ${whoName(S.turn)}</div>
        <div class="hint">اضغط لقلب البطاقة 🃏</div>
      </div>
      <div class="face front" style="--accent:${c.color}">
        <div class="chead">
          <span class="seal">${c.icon} ${c.name}</span>
          <span class="lvltag">${LVLS[card.l-1].icon} ${LVLS[card.l-1].name}${card.l>=3?" · اختياري":""}</span>
        </div>
        <div class="divider"></div>
        <div class="ctext">${esc(card.t)}</div>
        ${card.alt?`<div class="calt"><b>🌊 اللفتة البديلة</b><p>${esc(card.alt)}</p></div>`:""}
        <div class="judge">
          <div class="jhead">${pslot(j,"sm")} حكم ${whoName(j)}: هل ${j==="her"?"أكمل الزوج":"أكملت الزوجة"} البطاقة؟</div>
          <div class="jbtns">
            <button class="ok" onclick="event.stopPropagation();doneCard(true)">✓ أكملها — نجمة</button>
            <button class="oops" onclick="event.stopPropagation();showPenalty()">✗ لم يكملها.. عقوبة! 😅</button>
          </div>
        </div>
        <div class="penalty" id="penalty"></div>
      </div>
    </div>
  </div>
  <div class="safety">
    <button class="go" onclick="doneCard(false)"><span>🟢</span>استمرار<small>تم — التالي</small></button>
    <button class="slow" onclick="slowCard()"><span>🟡</span>أبطئ<small>نسخة أخف</small></button>
    <button class="skip" onclick="flipCard('${cat}')"><span>🔴</span>تجاوز<small>قبل البدء — بلا عقوبة</small></button>
  </div>
  <p class="center" style="margin-top:12px;font-size:.68rem;color:var(--ink-soft)">التجاوز قبل قبول البطاقة مجاني دائمًا — العقوبة فقط لمن قَبِل ثم لم يكمل 😉</p>
  `;
  setTimeout(()=>{const f=$("#flip");if(f&&!f.classList.contains("flipped"))f.classList.add("flipped");},2600);
};

/* قصاصة العقوبة الضاحكة */
window.showPenalty = () => {
  const box = $("#penalty");
  if(!box) return;
  const p = drawPenalty();
  box.innerHTML = `
    <span class="ptag">😅 عقوبة ${whoName(S.turn)}!</span>
    <h4>بحكم ${whoName(other())} — البطاقة لم تكتمل، والقصاص ضاحك:</h4>
    <div class="ptext">${esc(p)}</div>
    <div class="pbtns">
      <button class="done" onclick="event.stopPropagation();penaltyDone()">✔ نُفذت العقوبة — التالي</button>
      <button class="redo" onclick="event.stopPropagation();showPenalty()">🎲 غيّرها</button>
    </div>
    <small>عقوبة خفيفة للضحك لا للإحراج — وللحكم استبدالها بزر 🎲</small>
  `;
  box.classList.add("show");
};
window.penaltyDone = () => {
  S.penalties++; store("pen",S.penalties);
  toast("😂 قصاص عادل! نكمل الأمسية");
  doneCard(false);
};

window.slowCard = () => {
  const card = S.currentCard;
  if(card && card.alt){
    const f=$("#flip .ctext"); if(f){f.textContent=card.alt;toast("🌊 نسخة أهدأ من المهمة نفسها");return;}
  }
  const lvl=S.lvl; S.lvl=1;
  const alt = draw(Math.random()<.5?"gesture":"relax");
  S.lvl=lvl;
  if(alt){const f=$("#flip .ctext"); if(f){f.textContent=alt.t;toast("🌊 غيّرنا الإيقاع — نسخة أخف");}}
};

window.doneCard = (withStar) => {
  S.played++;
  if(withStar){
    S.stars++; store("stars",S.stars); confetti();
    S.bestCard = S.currentCard ? S.currentCard.t : null;
    if(S.stars%5===0) return rewardModal();
    toast("⭐ نجمة قرب جديدة! المجموع: "+S.stars);
  }
  S.turn = S.turn==="him"?"her":"him";
  routeNext();
};
function routeNext(){
  if(S.mode==="scenario") return nextInQueue();
  if(S.mode==="wheel") return go("wheel");
  if(S.mode==="doors") return nextDoor();
  if(S.mode==="doors2end"){S.mode="cards";return go("modes");}
  if(S.mode==="timer") return go("timer");
  go("play");
}

function rewardModal(){
  confetti();
  openModal(`
  <h3 style="font-size:1.3rem">🎁 خمس نجوم — مكافأة مشتركة!</h3>
  <p style="font-size:.8rem;color:var(--paper-soft);margin-top:6px">اختارا مكافأتكما وحددا لها موعدًا هذا الأسبوع</p>
  <div style="display:grid;gap:9px;margin-top:14px">
    ${REWARDS.map(r=>`<button class="btn sec" style="font-size:.9rem" onclick="pickReward('${r}')">${r}</button>`).join("")}
  </div>`);
}
window.pickReward = (r)=>{
  S.promises.push({t:"مكافأة ٥ نجوم: "+r, d:new Date().toLocaleDateString("ar-SA")});
  store("promises",S.promises); closeModal(); toast("سُجلت المكافأة في دفتركما 📔");
  S.turn = S.turn==="him"?"her":"him";
  routeNext();
};

/* ═══ العجلة ═══ */
views.wheel = () => {
  const n=WHEEL_SEGS.length, seg=360/n;
  const grad = WHEEL_SEGS.map((s,i)=>`${s.color} ${i*seg}deg ${(i+1)*seg}deg`).join(",");
  return `
  ${playTop("عجلة المزاج الجريء")}
  <div class="wheelwrap">
    <div class="wheelptr"></div>
    <div class="wheel" id="wheel" style="background:conic-gradient(from 0deg,${grad});transform:rotate(${S.wheelRot}deg)">
      ${WHEEL_SEGS.map((s,i)=>{
        const a=(i+.5)*seg;
        return `<div class="seg" style="transform:rotate(${a}deg) translateY(-112px) rotate(${-a}deg) translate(-50%,-50%)">${s.icon}<br>${s.name}</div>`;
      }).join("")}
    </div>
    <div class="wheelhub">🌹</div>
  </div>
  <button class="btn gold" style="max-width:230px;margin:14px auto 0" onclick="spin()">أديرا العجلة 🎡</button>
  <p class="center" style="margin-top:10px;font-size:.7rem;color:var(--ink-soft)">«أكمل»: أعيدا التحدي الذي أعجبكما بطريقة أطول أو أكثر قربًا</p>
  <button class="btn ghost" style="margin-top:14px" onclick="endSession()">🌙 إنهاء الجلسة</button>
  `;
};
window.spin = () => {
  const n=WHEEL_SEGS.length, seg=360/n;
  const pick=Math.floor(Math.random()*n);
  const target = 360*5 - (pick+.5)*seg;
  S.wheelRot += 360*5 + ((target - (S.wheelRot%360)) % 360);
  const w=$("#wheel"); w.style.transform=`rotate(${S.wheelRot}deg)`;
  setTimeout(()=>{
    const s=WHEEL_SEGS[pick];
    toast(s.icon+" "+s.name+"!");
    setTimeout(()=>{flipCard(s.cat);S.mode="wheel";},500);
  },4400);
};

/* ═══ تحدي الوقت ═══ */
views.timer = () => `
${playTop("تحدي الوقت والشرارة")}
<div class="paper tilt-l"><p style="font-size:.8rem">مؤقت من 30 ثانية إلى دقيقتين — الفائز يختار البطاقة التالية أو الأغنية، ومن ينسحب من تحدٍّ قَبِله فحكمه العقوبة الضاحكة 😅</p></div>
<div style="display:grid;gap:10px;margin-top:14px">
  ${TIMERS.map((t,i)=>`
  <button class="mode wide" style="margin:0" onclick="runTimer(${i})">
    <span class="ic">⏱️</span>
    <span class="txt"><b>${t.t}</b><br><small>${t.s>=60?(t.s/60)+" دقيقة":t.s+" ثانية"} — ${esc(t.r)}</small></span>
  </button>`).join("")}
</div>
<button class="btn ghost" style="margin-top:16px" onclick="endSession()">🌙 إنهاء الجلسة</button>
`;
window.runTimer = (i) => {
  const t=TIMERS[i]; let left=t.s, h=null;
  const wasScenario = S.mode==="scenario";
  S.currentCard = {t:t.t}; if(!wasScenario) S.mode="timer";
  const j = other();
  app.innerHTML = `
  ${playTop("تحدي الوقت")}
  <div class="paper tilt-r timerbox" style="position:relative">
    <h3 style="justify-content:center;font-size:1.15rem">⏱️ ${t.t}</h3>
    <div class="ring" id="ring" style="--pct:100%"><b id="tleft">${fmt(left)}</b></div>
    <p style="font-size:.85rem;line-height:1.9">${esc(t.r)}</p>
    <button class="btn primary" id="tbtn" style="max-width:210px;margin:12px auto 4px">ابدأ ▶️</button>
    <div class="judge" style="width:100%;margin:10px 0 0">
      <div class="jhead">${pslot(j,"sm")} حكم ${whoName(j)}</div>
      <div class="jbtns">
        <button class="ok" onclick="doneCard(true)">✓ أكملها — نجمة</button>
        <button class="oops" onclick="showPenalty()">✗ انسحب.. عقوبة! 😅</button>
      </div>
    </div>
    <div class="penalty" id="penalty"></div>
  </div>
  <div class="safety">
    <button class="skip" style="flex:1" onclick="${wasScenario?"doneCard(false)":"go('timer')"}"><span>🔴</span>تجاوز<small>قبل البدء — بلا عقوبة</small></button>
  </div>`;
  $("#tbtn").onclick = function(){
    if(h){clearInterval(h);h=null;this.textContent="ابدأ ▶️";return;}
    this.textContent="إيقاف ⏸️";
    h=setInterval(()=>{
      left--;
      $("#tleft").textContent=fmt(left);
      $("#ring").style.setProperty("--pct",(left/t.s*100)+"%");
      if(left<=0){clearInterval(h);h=null;$("#tleft").textContent="🎉";toast("انتهى الوقت! نفّذا النتيجة المرحة 😄");}
    },1000);
  };
};
const fmt = s => s>=60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : String(s);

/* ═══ ثلاثة أبواب ═══ */
views.doors = () => `
${playTop("ثلاثة أبواب — الجولة "+((S.doorRound||0)+1)+" من 6")}
<div class="velvetp" style="text-align:center">
  <p style="font-size:.82rem;color:var(--ink-soft)">يختار أحدكما الباب، ويقرأ الآخر البطاقة. ست جولات ثم بطاقة النهاية 🚪</p>
  <div class="doors">
    <button class="door" onclick="openDoor('talk')"><span class="ic">💬</span><b>باب الكلام</b></button>
    <button class="door" onclick="openDoor('move')"><span class="ic">💃</span><b>باب الحركة</b></button>
    <button class="door" onclick="openDoor('surp')"><span class="ic">🎁</span><b>باب المفاجأة</b></button>
  </div>
</div>
<button class="btn ghost" style="margin-top:18px" onclick="endSession()">🌙 إنهاء الجلسة</button>
`;
window.openDoor = (d) => {
  const map={talk:["truth","gesture"],move:["passion","laugh"],surp:["surprise","laugh"]};
  const pool=map[d].filter(c=>CATS[c].minLvl<=S.lvl);
  flipCard(pool[Math.floor(Math.random()*pool.length)]);
  S.mode="doors";
};
window.nextDoor = () => {
  S.doorRound=(S.doorRound||0)+1;
  if(S.doorRound>=6){flipCard("relax");toast("بطاقة النهاية 🌙");S.mode="doors2end";return;}
  go("doors");
};

/* ═══ السيناريوهات ═══ */
window.showScenarios = () => openModal(`
<h3 style="font-size:1.25rem">📋 سيناريوهات جاهزة</h3>
<div style="display:grid;gap:10px;margin-top:14px">
${SCENARIOS.map(s=>`
  <button class="mode wide" style="margin:0" onclick="closeModal();startScenario('${s.id}')">
    <span class="ic">${s.icon}</span>
    <span class="txt"><b>${s.name}</b><br><small>${s.time} · ${s.q.length} خطوة · درجة ${LVLS[s.lvl-1].name} ${LVLS[s.lvl-1].icon}</small></span>
  </button>`).join("")}
</div>`);
window.startScenario = (id) => {
  const sc=SCENARIOS.find(x=>x.id===id);
  S.lvl=sc.lvl; store("lvl",sc.lvl);
  S.mode="scenario"; S.queue=[...sc.q]; S.qi=0; S.played=0;
  if(id==="deepnight") toast("💌 اقتراح: ابدآ بكتابة أوراق صندوق الرسائل");
  nextInQueue();
};
window.nextInQueue = () => {
  if(!S.queue || S.qi>=S.queue.length){
    toast("اكتمل السيناريو! 🎉"); confetti(); return endSession();
  }
  const step=S.queue[S.qi++];
  if(step==="timer"){const i=Math.floor(Math.random()*TIMERS.length);runTimer(i);return;}
  flipCard(step); S.mode="scenario";
};

  <h3 style="font-size:1.25rem">🌙 ختام الجلسة — دفتر بيننا</h3>

  <div class="field"><label>💡 شيء جديد عرفته عن شريكي</label><input id="j-new" placeholder="اكتشاف صغير أو كبير…"></div>

};
window.saveSession = () => {
  const g=id=>$(id).value.trim();
  const e={d:new Date().toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long"}),
    best:g("#j-best"),nw:g("#j-new"),rep:g("#j-rep"),played:S.played};
  S.journal.unshift(e); store("journal",S.journal);
  const p=g("#j-prom");
  if(p){S.promises.unshift({t:p,d:e.d,pending:true});store("promises",S.promises);}
  closeModal(); confetti(); toast("حُفظت الجلسة في دفتركما 📔");
  S.played=0; go("book");
};

<div class="paper tilt-r">

window.upImg = (ev,who) => {
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload = () => {
    const img=new Image();
    img.onload = () => {
      const c=document.createElement("canvas"),m=Math.min(img.width,img.height),s=512;
      c.width=c.height=s;
      c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
      try{store("img-"+who,c.toDataURL("image/jpeg",.85));toast("حُفظت الصورة 📸");go("settings");}
      catch(e){toast("الصورة كبيرة جدًا — جربا صورة أصغر");}
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
};

window.showRules = () => openModal(`

/* ═══════════════ التنقل ═══════════════ */
window.go = (v) => {
  if(views[v]) app.innerHTML = views[v]();
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  window.scrollTo({top:0});
};
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>go(b.dataset.v));
go("home");

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
