# Edge router for albushra.app (see worker/router.js).
# Deployed by .github/workflows/albushra-app.yml; routes are attached to the
# albushra.app zone, so every proxied host in that zone reaches this Worker.
name = "albushra-router"
main = "worker/router.js"
compatibility_date = "2025-10-01"
workers_dev = false
routes = [
  { pattern = "albushra.app/*", zone_name = "albushra.app" },
  { pattern = "*.albushra.app/*", zone_name = "albushra.app" }
]

# Which apps the owner hid from the public site (dashboard toggle).
# No id on purpose: wrangler creates the namespace on the first deploy and
# reuses it afterwards (needs "Workers KV Storage: Edit" on the CI token).
[[kv_namespaces]]
binding = "VISIBILITY"

# Data of the owner's private dashboard ameer.albushra.app (worker/ameer.js).
# Created on the first deploy, like VISIBILITY.
[[kv_namespaces]]
binding = "AMEER"

# Secrets (set by the workflow from GitHub secrets, never stored here):
#   AMEER_OWNER_EMAILS  - the only email(s) allowed into ameer.albushra.app
#   AMEER_INGEST_TOKEN  - bearer token for https://albushra.app/__ameer/ingest
# ameer.albushra.app uses the same Access application as dash.albushra.app
# (add it as a second hostname there), so ACCESS_AUD below covers both. If you
# make a separate Access application instead, add AMEER_ACCESS_AUD here.

# The dashboard's owner API only trusts requests signed by this Cloudflare
# Access application (dash.albushra.app). Neither value is a secret.
[vars]
ACCESS_TEAM_DOMAIN = "tiny-recipe-f690.cloudflareaccess.com"
ACCESS_AUD = "8a3bc4cec75935968f95f632eddbc499a9829a376cdd339c595593ee9d452657"
