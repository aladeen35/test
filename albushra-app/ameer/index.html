<!doctype html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d17">
<title>أمير — لوحة القيادة</title>
<link rel="icon" href="https://albushra.app/brand/mark-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ameer.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date"><span id="date"></span><span id="greet"></span></div>
    </div>
    <div class="pills" id="pills" aria-live="polite"></div>
    <div class="tools">
      <button class="icon-btn" type="button" id="refresh" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
      <button class="icon-btn" type="button" id="lang" aria-label="Language"><span class="l-ar">EN</span><span class="l-en">ع</span></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="views">
    <section data-view="overview" class="view">
      <div class="hero" id="hero"></div>
      <h2 class="sec"><span data-t="repos"></span></h2>
      <div class="rooms" id="rooms"></div>
      <h2 class="sec"><span data-t="pipelines"></span></h2>
      <div class="runs" id="runs"></div>
      <h2 class="sec"><span data-t="metrics"></span></h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section data-view="claude" class="view" hidden>
      <h2 class="sec"><span data-t="sessions"></span></h2>
      <div class="sessions" id="sessions"></div>
      <h2 class="sec"><span data-t="timeline"></span></h2>
      <div class="filters" id="tl-filters" role="toolbar"></div>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section data-view="apps" class="view" hidden>
      <h2 class="sec"><span data-t="sites"></span></h2>
      <div class="sites" id="sites"></div>
    </section>

    <section data-view="devices" class="view" hidden>
      <h2 class="sec"><span data-t="devices"></span></h2>
      <div class="devices" id="devices"></div>
      <div class="card setup" id="setup"></div>
    </section>

    <section data-view="notes" class="view" hidden>
      <h2 class="sec"><span data-t="notes"></span></h2>
      <form class="note-form" id="note-form">
        <input id="note-text" maxlength="500" autocomplete="off" required>
        <button class="btn" type="submit" data-t="add"></button>
      </form>
      <ul class="notes" id="notes"></ul>
    </section>
  </main>

  <footer class="foot">
    <img src="https://albushra.app/brand/mark-192.png" width="22" height="22" alt="">
    <span>البشرى للتكنولوجيا · Albushra Technology</span>
    <span class="muted" id="updated"></span>
  </footer>
</div>

<nav class="dock" id="dock" aria-label="Sections"></nav>
<script src="/ameer.js" defer></script>
</body>
</html>
