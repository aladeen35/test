<!doctype html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة التطبيقات — البشرى للتكنولوجيا</title>
<link rel="icon" href="/brand/mark-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/dash/dash.css">
<script>(function(){try{var l=localStorage.getItem('ab-lang');if(l==='en'){var d=document.documentElement;d.setAttribute('data-lang','en');d.lang='en';d.dir='ltr';}var th=localStorage.getItem('ab-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}})();</script>
</head>
<body class="dash">
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="https://albushra.app/">
      <img src="/brand/mark-192.png" width="40" height="40" alt="">
      <span class="brand-txt"><span class="l-ar">لوحة التطبيقات</span><span class="l-en">Apps dashboard</span><small>ALBUSHRA</small></span>
    </a>
    <div class="tools" style="margin-inline-start:auto">
      <button class="btn-ghost" type="button" id="refresh" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
      <button class="btn-ghost" type="button" data-toggle-lang aria-label="Language"><span class="l-ar">EN</span><span class="l-en">ع</span></button>
      <button class="btn-ghost" type="button" data-toggle-theme aria-label="Theme"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </div>
</header>
<main id="main" class="wrap">
  <section class="kpis" id="kpis" aria-live="polite"></section>
  <div class="dash-bar">
    <div class="filters" id="filters" role="toolbar"></div>
    <label class="search"><span class="sr">Search</span><input type="search" id="q" placeholder="بحث / Search" autocomplete="off"></label>
  </div>
  <section id="list" class="dash-list"></section>
  <p class="muted small" id="gen"></p>
</main>
<script src="/assets/site.js" defer></script>
<script src="/dash/dash.js" defer></script>
</body>
</html>
